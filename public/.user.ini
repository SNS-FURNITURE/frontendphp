; Plesk / shared hosting PHP overrides (place stays in public/ = document root)
; Domain → PHP Settings may override these; match PHP 8.3+ in Plesk.

memory_limit = 256M
max_execution_time = 120
max_input_time = 120
post_max_size = 64M
upload_max_filesize = 32M
max_file_uploads = 20

; Sessions / security
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

; Performance
opcache.enable = 1
opcache.memory_consumption = 128
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Disable dangerous functions if host allows (comment out if site breaks)
; disable_functions = exec,passthru,shell_exec,system,proc_open,popen

display_errors = Off
log_errors = On
expose_php = Off
allow_url_include = Off
